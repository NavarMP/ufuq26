<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">UFUQ ’26 — Rooted in Ilm. Ready for the World.</title>
  <desc id="desc">An editorial midnight-blue cover with the UFUQ ’26 identity, Arabic title, gold horizon lines, and a softly animated orbital motif.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="35" x2="1480" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D32"/>
      <stop offset=".58" stop-color="#0C1728"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(1 0 0 1 1190 305) scale(420 355)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#527A70" stop-opacity=".37"/>
      <stop offset=".55" stop-color="#527A70" stop-opacity=".09"/>
      <stop offset="1" stop-color="#527A70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="100" y1="0" x2="1415" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECDCB9"/>
      <stop offset=".52" stop-color="#C9A45C"/>
      <stop offset="1" stop-color="#8D713F"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" stroke="#ECDCB9" stroke-opacity=".035"/>
      <circle cx="0" cy="0" r="1.3" fill="#ECDCB9" fill-opacity=".14"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <style>
      .orbit { transform-origin: 1190px 315px; animation: orbit 28s linear infinite; }
      .glint { animation: glint 4.8s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes glint { 0%, 100% { opacity: .32; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) { .orbit, .glint { animation: none; } }
    </style>
  </defs>
  <rect width="1600" height="680" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="680" rx="36" fill="url(#grid)"/>
  <rect width="1600" height="680" rx="36" fill="url(#halo)"/>
  <path d="M0 560C278 490 476 640 760 562s513-141 840-66" stroke="#C9A45C" stroke-opacity=".16" stroke-width="1.2"/>
  <path d="M0 581C286 510 468 659 768 584s502-137 832-62" stroke="#527A70" stroke-opacity=".24" stroke-width="1.2"/>
  <path d="M0 604C274 538 476 684 768 607s517-131 832-62" stroke="#C9A45C" stroke-opacity=".1" stroke-width="1"/>
  <g opacity=".42" stroke="#C9A45C">
    <circle cx="1190" cy="315" r="216" stroke-opacity=".26"/>
    <circle cx="1190" cy="315" r="266" stroke-opacity=".16"/>
    <circle cx="1190" cy="315" r="316" stroke-opacity=".09"/>
    <ellipse cx="1190" cy="315" rx="316" ry="112" transform="rotate(-35 1190 315)" stroke-opacity=".22"/>
    <ellipse cx="1190" cy="315" rx="316" ry="112" transform="rotate(35 1190 315)" stroke-opacity=".13"/>
  </g>
  <g class="orbit">
    <circle cx="1190" cy="49" r="4" fill="#ECDCB9"/>
    <circle cx="1190" cy="49" r="12" fill="#C9A45C" fill-opacity=".18" filter="url(#blur)"/>
  </g>
  <g fill="#ECDCB9">
    <circle class="glint" cx="971" cy="195" r="2.2"/>
    <circle cx="1377" cy="172" r="1.8" opacity=".5"/>
    <circle class="glint" cx="1432" cy="413" r="1.7"/>
    <circle cx="1050" cy="488" r="1.5" opacity=".42"/>
    <circle cx="1278" cy="87" r="1.4" opacity=".55"/>
  </g>
  <g transform="translate(1128 253)">
    <rect width="124" height="124" rx="34" fill="#101D32" fill-opacity=".55" stroke="#C9A45C" stroke-opacity=".46"/>
    <path d="M33 35h58v10H33zM45 55v42h10V70h14v27h20V55H79v27H65V55H45z" fill="#C9A45C"/>
    <path d="M62 45h13v13H62z" fill="#527A70"/>
    <path d="M62 68h13v13H62z" fill="#527A70"/>
    <path d="M45 68h13v13H45z" fill="#527A70"/>
    <path d="M79 82h12v13H79z" fill="#ECDCB9"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="100" y="92" width="8" height="8" rx="4" fill="#C9A45C"/>
    <text x="126" y="101" fill="#ECDCB9" font-size="15" font-weight="700" letter-spacing="3.4">ALATHURPADI DARS STUDENTS ASSOCIATION</text>
    <text x="98" y="248" fill="#ECDCB9" font-size="40" font-weight="400" letter-spacing="2">أُفُق</text>
    <text x="94" y="365" fill="#F8F5EE" font-size="112" font-weight="700" letter-spacing="-5">UFUQ <tspan fill="#C9A45C">’26</tspan></text>
    <text x="102" y="413" fill="#8CB1A4" font-size="18" font-weight="700" letter-spacing="4.2">A TRANSITION &amp; LEADERSHIP CAMP</text>
    <path d="M102 449H445" stroke="url(#gold)" stroke-width="2"/>
    <text x="102" y="492" fill="#F1EBDD" font-size="26" font-weight="400">Rooted in Ilm. Ready for the World.</text>
    <g font-size="15" font-weight="600" letter-spacing="1.2">
      <rect x="102" y="535" width="212" height="43" rx="21.5" fill="#FFFFFF" fill-opacity=".055" stroke="#ECDCB9" stroke-opacity=".2"/>
      <text x="124" y="562" fill="#ECDCB9">24 — 30 DECEMBER 2026</text>
      <rect x="329" y="535" width="205" height="43" rx="21.5" fill="#FFFFFF" fill-opacity=".055" stroke="#ECDCB9" stroke-opacity=".2"/>
      <text x="351" y="562" fill="#ECDCB9">KERALA · INDIA</text>
    </g>
  </g>
  <text x="1492" y="620" text-anchor="end" fill="#ECDCB9" fill-opacity=".55" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">A HORIZON OF POSSIBILITY</text>
