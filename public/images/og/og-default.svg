<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16253f" />
      <stop offset="50%" stop-color="#101d32" />
      <stop offset="100%" stop-color="#070b13" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b577" />
      <stop offset="50%" stop-color="#c9a45c" />
      <stop offset="100%" stop-color="#f5ad1f" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Geometric Rings & Starlight Background -->
  <g stroke="rgba(201, 164, 92, 0.12)" stroke-width="1.5" fill="none">
    <circle cx="600" cy="280" r="140" />
    <circle cx="600" cy="280" r="240" />
    <circle cx="600" cy="280" r="340" />
    <circle cx="600" cy="280" r="440" />
    <!-- Diagonal Lattice Rays -->
    <line x1="600" y1="280" x2="200" y2="0" />
    <line x1="600" y1="280" x2="1000" y2="0" />
    <line x1="600" y1="280" x2="200" y2="560" />
    <line x1="600" y1="280" x2="1000" y2="560" />
  </g>

  <!-- Outer Double Gold Frame -->
  <rect x="36" y="36" width="1128" height="558" rx="28" fill="none" stroke="rgba(201, 164, 92, 0.4)" stroke-width="2" />
  <rect x="48" y="48" width="1104" height="534" rx="20" fill="none" stroke="rgba(201, 164, 92, 0.2)" stroke-width="1" />

  <!-- Corner Diamonds -->
  <circle cx="48" cy="48" r="4" fill="#f5ad1f" />
  <circle cx="1152" cy="48" r="4" fill="#f5ad1f" />
  <circle cx="48" cy="582" r="4" fill="#f5ad1f" />
  <circle cx="1152" cy="582" r="4" fill="#f5ad1f" />

  <!-- Top Organizer Ribbon -->
  <text x="600" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4" fill="#c9a45c" text-anchor="middle">
    ALATHURPADI DARS STUDENTS ASSOCIATION (ADSA) · SUFFA DARS
  </text>

  <!-- Arabic Calligraphy Logo Glow -->
  <text x="600" y="210" font-family="'Traditional Arabic', 'Amiri', serif" font-size="92" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)">
    أُفُق
  </text>

  <!-- English Title -->
  <text x="600" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="1" fill="#ffffff" text-anchor="middle">
    UFUQ ’26
  </text>

  <!-- Subtitle -->
  <text x="600" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#c9a45c" text-anchor="middle">
    A Transition &amp; Leadership Camp
  </text>

  <!-- Tagline -->
  <text x="600" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-style="italic" fill="#f5f0e8" text-anchor="middle" opacity="0.9">
    “Rooted in Ilm. Ready for the World.”
  </text>

  <!-- Central Info Banner Card -->
  <rect x="250" y="445" width="700" height="74" rx="20" fill="rgba(16, 29, 50, 0.85)" stroke="rgba(201, 164, 92, 0.45)" stroke-width="1.5" />
  
  <text x="380" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">
    🗓️ DECEMBER 24–30, 2026
  </text>
  
  <line x1="535" y1="460" x2="535" y2="505" stroke="rgba(201, 164, 92, 0.3)" stroke-width="1" />

  <text x="730" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f5ad1f" text-anchor="middle">
    📍 ALATHURPADI DARS CAMPUS
  </text>

  <!-- Bottom URL -->
  <text x="600" y="560" font-family="monospace" font-size="14" font-weight="600" fill="rgba(245, 240, 232, 0.6)" letter-spacing="2" text-anchor="middle">
    HTTPS://ALATHURPADIDARS.IN
  </text>
</svg>
